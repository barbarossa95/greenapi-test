# Production: приложение за Traefik.
# Требуется внешняя сеть traefik-public и DOMAIN в .env.
# Команда запуска: docker compose up -d
# Приложение: https://greenapi.${DOMAIN}

services:
  frontend:
    container_name: greenapi-front
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - traefik-public
    labels:
      - 'traefik.enable=true'
      # Domain the app is served on
      - 'traefik.http.routers.greenapi-front.rule=Host(`greenapi.${DOMAIN:?DOMAIN must be set}`)'
      - 'traefik.http.routers.greenapi-front.entrypoints=websecure'
      - 'traefik.http.routers.greenapi-front.tls.certresolver=letsencrypt'
      # Port the app listens on INSIDE the container
      - 'traefik.http.services.greenapi-front.loadbalancer.server.port=3000'
      # Optional: protect with the dashboard basic auth
      # - 'traefik.http.routers.greenapi-front.middlewares=auth@docker'

networks:
  traefik-public:
    external: true
